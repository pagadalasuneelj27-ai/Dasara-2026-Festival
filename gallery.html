<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery – Dasara 2026</title>
<style>
  :root{--c1:#c2410c;--c2:#facc15;--c3:#7f1d1d;--bg:#fff7ed}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,'Noto Sans Telugu',serif;background:var(--bg);color:#2b1810}
  header{text-align:center;padding:40px 16px;color:#fff;background:linear-gradient(135deg,var(--c3),var(--c1))}
  header h1{font-size:clamp(1.8rem,6vw,3rem)}
  header a{display:inline-block;margin-top:12px;background:var(--c2);color:var(--c3);padding:8px 20px;border-radius:30px;text-decoration:none;font-weight:bold}
  section{max-width:1100px;margin:0 auto;padding:36px 16px}
  h2{color:var(--c1);margin-bottom:16px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .grid img,.grid video{width:100%;height:210px;object-fit:cover;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);background:#fde68a}
  .vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .vids video{width:100%;border-radius:14px;background:#000}
  .note{text-align:center;color:#78350f;margin-top:10px;font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1>📸 Dasara Gallery 🎥</h1>
  <a href="index.html">← Back to home</a>
</header>

<section>
  <h2>Photos</h2>
  <!-- To add a photo: upload it into the images folder, then copy one line below and change the file name -->
  <div class="grid">
    <img src="images/photo1.jpg" alt="Photo 1" onerror="this.style.display='none'">
    <img src="images/photo2.jpg" alt="Photo 2" onerror="this.style.display='none'">
    <img src="images/photo3.jpg" alt="Photo 3" onerror="this.style.display='none'">
    <img src="images/photo4.jpg" alt="Photo 4" onerror="this.style.display='none'">
    <img src="images/photo5.jpg" alt="Photo 5" onerror="this.style.display='none'">
    <img src="images/photo6.jpg" alt="Photo 6" onerror="this.style.display='none'">
    <img src="images/photo7.jpg" alt="Photo 7" onerror="this.style.display='none'">
    <img src="images/photo8.jpg" alt="Photo 8" onerror="this.style.display='none'">
  </div>
  <p class="note">Photos appear here as soon as they are uploaded to the images folder.</p>
</section>

<section>
  <h2>Videos</h2>
  <!-- To add a video: upload it into the videos folder (keep each under 25 MB), then copy one block and change the file name -->
  <div class="vids">
    <video controls preload="metadata" src="videos/video1.mp4"></video>
    <video controls preload="metadata" src="videos/video2.mp4"></video>
  </div>
  <p class="note">Tip: for big videos, upload to YouTube and paste the link instead.</p>
</section>
</body>
</html>
